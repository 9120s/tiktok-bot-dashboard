<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تنبيهات تيك توك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #121212;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar h2 {
            color: #ff0050;
            margin-bottom: 30px;
            font-size: 20px;
        }
        .menu-item {
            display: block;
            padding: 12px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .menu-item:hover, .menu-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }
        .logout-btn {
            background-color: #ff0050;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background-color: #e00047;
        }
        .content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .card {
            background: #242424;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .card h3 {
            margin-bottom: 20px;
            color: #00f2fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .form-control:focus {
            outline: none;
            border-color: #00f2fe;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff0050, #00f2fe);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>تنبيهات البث</h2>
            <a href="/" class="menu-item active">إضافة تنبيه</a>
        </div>
        
        <div>
            {% if user %}
                <p style="color: #888; margin-bottom: 10px;">أهلاً، {{ user['username'] }}</p>
                <!-- رابط تسجيل الخروج الفعلي المربوط بالمسار /logout -->
                <a href="/logout" class="logout-btn">تسجيل الخروج</a>
            {% else %}
                <a href="/login" class="logout-btn" style="background-color: #5865F2;">تسجيل الدخول بالديسكورد</a>
            {% endif %}
        </div>
    </div>

    <div class="content">
        <div class="card">
            <h3>إضافة تنبيه جديد</h3>
            <form action="/add_alert" method="POST">
                
                <div class="form-group">
                    <label for="guild_id">اختر السيرفر (السيرفرات برتبتك فقط):</label>
                    <select name="guild_id" id="guild_id" class="form-control" required>
                        {% if guilds %}
                            {% for guild in guilds %}
                                <option value="{{ guild['id'] }}">{{ guild['name'] }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="">لا توجد سيرفرات تملك فيها صلاحيات أدمن</option>
                        {% endif %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="channel_id">معرف روم الديسكورد (Channel ID):</label>
                    <input type="text" name="channel_id" id="channel_id" class="form-control" placeholder="أدخل رقم روم الإشعارات..." required>
                </div>

                <div class="form-group">
                    <label for="tiktok_username">يوزر التيك توك (بدون @):</label>
                    <input type="text" name="tiktok_username" id="tiktok_username" class="form-control" placeholder="مثال: 2vce4" required>
                </div>

                <button type="submit" class="btn-submit">حفظ التنبيه</button>
            </form>
        </div>
    </div>

</body>
</html>
