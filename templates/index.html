<script>
    // 1. قراءة التوكن من رابط URL بعد العودة من ديسكورد وحفظه
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');

    if (tokenFromUrl) {
        localStorage.setItem('discord_token', tokenFromUrl);
        // إزالة التوكن من الرابط لإبقاء الشكل نظيفاً
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    const currentToken = localStorage.getItem('discord_token');
    const authContainer = document.getElementById('authContainer');

    // 2. تحديث شكل الزر في حال وجود توكن مسجل
    if (currentToken && currentToken !== 'null' && authContainer) {
        authContainer.innerHTML = `
            <a href="/" onclick="localStorage.removeItem('discord_token');" class="btn-login" style="background-color: #232329; border: 1px solid #3d3d4a;">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
            </a>
        `;
    }

    // 3. دالة جلب السيرفرات بناءً على التوكن
    async function loadGuilds() {
        const guildSelect = document.getElementById('guild_id');
        const activeToken = localStorage.getItem('discord_token') || '';

        try {
            const res = await fetch(`/api/guilds?token=${activeToken}`);
            const data = await res.json();
            
            if (data.guilds && data.guilds.length > 0) {
                guildSelect.innerHTML = '<option value="">اختر السيرفر...</option>';
                data.guilds.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.innerText = g.name;
                    guildSelect.appendChild(opt);
                });
            } else {
                guildSelect.innerHTML = '<option value="">لم يتم العثور على سيرفرات</option>';
            }
        } catch (e) {
            console.error('خطأ في جلب السيرفرات:', e);
        }
    }

    // تشغيل جلب السيرفرات عند فتح الصفحة
    loadGuilds();
</script>
